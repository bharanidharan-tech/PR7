<!DOCTYPE html>
<html>
<head>
    <title>Responsive Image Gallery</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #333;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            max-width: 1100px;
            margin: auto;
        }

        .gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }

        /* Tablet */
        @media (max-width: 900px) {
            .gallery {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* Mobile */
        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }

            .gallery img {
                height: 150px;
            }
        }

        /* Small Mobile */
        @media (max-width: 350px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>GALLERY</h1>

    <div class="gallery">
        <img src="/leo.jpg">
        <img src="/imge.jpg">
        <img src="/Image.jpg">
        <img src="/Veg image.png">

        <img src="/Compass.jpg">
        <img src="/Barca.jpg">
        <img src="/dead.jpeg">
        <img src="/LEOMESSI.jpg">
    </div>

</body>
</html>
